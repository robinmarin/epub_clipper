[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epub-to-md"
version = "1.0.0"
description = "Convert EPUB files to per-chapter markdown for LLM knowledge bases"
readme = "epub_to_md/README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Developer"}
]
keywords = ["epub", "markdown", "converter", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "ebooklib>=0.17",
    "beautifulsoup4>=4.9.0",
    "markdownify>=0.11.0",
    "lxml>=4.9.0",
    "python-slugify>=8.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://github.com/example/epub-to-md"

[project.scripts]
epub-to-md = "epub_to_md.cli:main"